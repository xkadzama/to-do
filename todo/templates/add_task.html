<style>
/* Базовые стили */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
    color: #ffffff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

/* Контейнер */
.container {
    background: #111111;
    padding: 50px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(255, 69, 0, 0.1);
    border: 1px solid #333333;
    width: 100%;
    max-width: 450px;
    position: relative;
    overflow: hidden;
}

/* Декоративные элементы */
.container::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(255, 69, 0, 0.1) 0%, transparent 70%);
    border-radius: 50%;
}

.container::after {
    content: '';
    position: absolute;
    bottom: -40px;
    left: -40px;
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.08) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
}

/* Заголовок */
h1 {
    text-align: center;
    color: #ffffff;
    margin-bottom: 35px;
    font-size: 2.2em;
    font-weight: 700;
    text-shadow: 0 4px 8px rgba(255, 69, 0, 0.3);
    position: relative;
    padding-bottom: 15px;
}

h1::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #ff4500, #ff8c00);
    border-radius: 2px;
}

/* Форма */
form {
    display: flex;
    flex-direction: column;
    gap: 25px;
    position: relative;
    z-index: 1;
}

/* Поле ввода */
input[type="text"] {
    padding: 18px 20px;
    border-radius: 12px;
    border: 2px solid rgba(255, 69, 0, 0.2);
    outline: none;
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    font-size: 16px;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    font-family: inherit;
}

input[type="text"]::placeholder {
    color: rgba(255, 255, 255, 0.4);
    font-style: italic;
}

input[type="text"]:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: #ff4500;
    box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.2);
    transform: translateY(-2px);
}

input[type="text"]:hover {
    border-color: rgba(255, 69, 0, 0.4);
    background: rgba(255, 255, 255, 0.07);
}

/* Кнопка создания задачи */
button {
    background: linear-gradient(135deg, #ff4500, #ff8c00);
    border: none;
    color: #000000;
    font-size: 16px;
    font-weight: 700;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 20px rgba(255, 69, 0, 0.3);
    position: relative;
    overflow: hidden;
}

button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

button:hover::before {
    left: 100%;
}

button:hover {
    background: linear-gradient(135deg, #ff8c00, #ff4500);
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255, 69, 0, 0.4);
}

button:active {
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
}

/* Ссылка назад */
.back-link {
    display: block;
    text-align: center;
    margin-top: 25px;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.05);
    color: #ff8c00;
    border-radius: 12px;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 69, 0, 0.2);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 1;
}

.back-link:hover {
    background: rgba(255, 69, 0, 0.1);
    color: #ff4500;
    transform: translateY(-2px);
    border-color: rgba(255, 69, 0, 0.4);
    box-shadow: 0 6px 15px rgba(255, 69, 0, 0.2);
}

/* Анимация появления */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.container > * {
    animation: fadeInUp 0.6s ease-out;
}

form {
    animation-delay: 0.1s;
    animation-fill-mode: both;
}

.back-link {
    animation-delay: 0.2s;
    animation-fill-mode: both;
}

/* Адаптивность */
@media (max-width: 768px) {
    body {
        padding: 15px;
    }

    .container {
        padding: 40px 30px;
    }

    h1 {
        font-size: 1.8em;
        margin-bottom: 25px;
    }

    input[type="text"] {
        padding: 15px 18px;
        font-size: 15px;
    }

    button {
        padding: 14px;
        font-size: 15px;
    }

    .back-link {
        padding: 12px 18px;
        font-size: 14px;
    }
}

/* Эффект фокуса для всей формы */
form:focus-within {
    transform: translateY(-5px);
    transition: transform 0.3s ease;
}
</style>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Добавить задачу</title>
</head>
<body>
<div class="container">
    <h1>Добавить задачу</h1>
    <form action="{{ url_for('tasks.add_task') }}" method="POST">
      <input name='title' type="text" placeholder="Введите название задачи">
      <button type="submit">Создать задачу</button>
    </form>

    <a class="back-link" href="{{ url_for('tasks.get_all_tasks') }}">Вернуться назад</a>
</div>
</body>
</html>
