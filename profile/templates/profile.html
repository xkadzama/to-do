<style>
/* Базовые стили */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
    color: #ffffff;
    min-height: 100vh;
    padding: 40px 20px;
    line-height: 1.6;
}

/* Контейнер профиля */
body {
    max-width: 800px;
    margin: 0 auto;
    background: #111111;
    border-radius: 20px;
    padding: 50px;
    box-shadow: 0 20px 40px rgba(255, 69, 0, 0.1);
    border: 1px solid #333333;
    position: relative;
    overflow: hidden;
}

/* Декоративный элемент */
body::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255, 69, 0, 0.1) 0%, transparent 70%);
    border-radius: 50%;
}

/* Заголовок */
h1 {
    color: #ffffff;
    font-size: 2.5em;
    margin-bottom: 40px;
    text-align: center;
    font-weight: 700;
    text-shadow: 0 4px 8px rgba(255, 69, 0, 0.3);
    position: relative;
    padding-bottom: 15px;
}

h1::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #ff4500, #ff8c00);
    border-radius: 2px;
}

/* Параграфы с информацией */
p {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px 25px;
    margin: 20px 0;
    border-radius: 12px;
    border-left: 4px solid #ff4500;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 69, 0, 0.1);
}

p:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateX(5px);
    border-left: 4px solid #ff8c00;
}

/* Ссылки */
a {
    color: #ff8c00;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
    position: relative;
    padding: 5px 0;
}

a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #ff4500, #ff8c00);
    transition: width 0.3s ease;
}

a:hover {
    color: #ff4500;
}

a:hover::after {
    width: 100%;
}

/* Специфичные стили для ссылок в параграфах */
p:nth-last-child(2) a,
p:nth-last-child(1) a {
    display: inline-block;
    background: linear-gradient(135deg, #ff4500, #ff8c00);
    color: #000000;
    padding: 12px 25px;
    border-radius: 8px;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.9em;
    letter-spacing: 0.5px;
    border: none;
    box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
}

p:nth-last-child(2) a::after,
p:nth-last-child(1) a::after {
    display: none;
}

p:nth-last-child(2) a:hover,
p:nth-last-child(1) a:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 69, 0, 0.4);
    background: linear-gradient(135deg, #ff8c00, #ff4500);
    color: #000000;
}

/* Адаптивность */
@media (max-width: 768px) {
    body {
        padding: 30px 20px;
        margin: 20px;
    }

    h1 {
        font-size: 2em;
    }

    p {
        padding: 15px 20px;
    }
}

/* Анимация появления */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1, p {
    animation: fadeInUp 0.6s ease-out;
}

p:nth-child(2) { animation-delay: 0.1s; }
p:nth-child(3) { animation-delay: 0.2s; }
p:nth-child(4) { animation-delay: 0.3s; }
p:nth-child(5) { animation-delay: 0.4s; }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
</head>
<body>
<h1>Профиль пользователя</h1>
<p>Имя профиля: {{ current_user.username }}</p>
<p>Почта: {{ current_user.email }}</p>
<p><a href="{{ url_for('tasks.get_all_tasks') }}">Показать все задачи</a></p>
<p><a href="{{ url_for('profile.edit_profile') }}">Редактировать профиль</a></p>
</body>
</html>
