<style>
/* Базовые стили */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
    color: #ffffff;
    min-height: 100vh;
    padding: 40px 20px;
    line-height: 1.6;
}

/* Контейнер формы */
body {
    max-width: 600px;
    margin: 0 auto;
    background: #111111;
    border-radius: 20px;
    padding: 50px;
    box-shadow: 0 20px 40px rgba(255, 69, 0, 0.1);
    border: 1px solid #333333;
    position: relative;
    overflow: hidden;
}

/* Декоративный элемент */
body::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(255, 69, 0, 0.1) 0%, transparent 70%);
    border-radius: 50%;
}

body::after {
    content: '';
    position: absolute;
    bottom: -50px;
    left: -50px;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle, rgba(255, 140, 0, 0.1) 0%, transparent 70%);
    border-radius: 50%;
}

/* Заголовок */
h1 {
    color: #ffffff;
    font-size: 2.2em;
    margin-bottom: 40px;
    text-align: center;
    font-weight: 700;
    text-shadow: 0 4px 8px rgba(255, 69, 0, 0.3);
    position: relative;
    padding-bottom: 15px;
}

h1::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 4px;
    background: linear-gradient(90deg, #ff4500, #ff8c00);
    border-radius: 2px;
}

/* Форма */
form {
    display: flex;
    flex-direction: column;
    gap: 25px;
}

/* Группы полей ввода */
form label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #ff8c00;
    font-size: 1em;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

form input[type="text"],
form input[type="email"] {
    width: 100%;
    padding: 15px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 69, 0, 0.2);
    border-radius: 10px;
    color: #ffffff;
    font-size: 1em;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

form input[type="text"]:focus,
form input[type="email"]:focus {
    outline: none;
    border-color: #ff4500;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.2);
    transform: translateY(-2px);
}

form input[type="text"]:hover,
form input[type="email"]:hover {
    border-color: rgba(255, 69, 0, 0.4);
    background: rgba(255, 255, 255, 0.07);
}

/* Кнопка */
button {
    background: linear-gradient(135deg, #ff4500, #ff8c00);
    color: #000000;
    border: none;
    padding: 16px 30px;
    border-radius: 10px;
    font-size: 1.1em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    box-shadow: 0 6px 20px rgba(255, 69, 0, 0.3);
    position: relative;
    overflow: hidden;
}

button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

button:hover::before {
    left: 100%;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255, 69, 0, 0.4);
    background: linear-gradient(135deg, #ff8c00, #ff4500);
}

button:active {
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
}

/* Плейсхолдеры */
::placeholder {
    color: rgba(255, 255, 255, 0.4);
    font-style: italic;
}

/* Адаптивность */
@media (max-width: 768px) {
    body {
        padding: 30px 20px;
        margin: 20px;
    }

    h1 {
        font-size: 1.8em;
    }

    form input[type="text"],
    form input[type="email"] {
        padding: 12px 16px;
    }

    button {
        padding: 14px 25px;
        font-size: 1em;
    }
}

/* Анимация появления */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1, form {
    animation: fadeInUp 0.6s ease-out;
}

form label:nth-child(1),
form label:nth-child(3) {
    animation: fadeInUp 0.6s ease-out 0.2s both;
}

form input:nth-child(2),
form input:nth-child(4) {
    animation: fadeInUp 0.6s ease-out 0.3s both;
}

button {
    animation: fadeInUp 0.6s ease-out 0.4s both;
}
</style>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактирование профиля</title>
</head>
<body>
<h1>Редактирование профиля</h1>
  <form action="{{ url_for('profile.edit_profile') }}" method="POST">
    <label>Сменить никнейм: </label><input type="text" name="username" placeholder="Введите новый никнейм">
    <label>Сменить почту: </label><input type="email" name="email" placeholder="Введите новую почту">
    <button type="submit">Сохранить изменения</button>
  </form>
</body>
</html>
